# Gemeinsame Compose-Datei für Pi-hole, Portainer, Watchtower und Nginx.
# Zusammengeführt aus den einzelnen Compose-Dateien (bleiben unverändert erhalten):
#   pihole/pihole.yml, portainer/portainer.yml, watchtower/watchtower.yml, nginx/nginx.yml
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp"
      - "80:80/tcp"
    environment:
      TZ: 'Europe/Berlin'
      # WEBPASSWORD: 'set a secure password here or it will be random'
    volumes:
      - './pihole/etc-pihole:/etc/pihole'
      - './pihole/etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - lab_net

  portainer:
    image: portainer/portainer-ce
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/portainer_data:/data
    restart: always
    networks:
      - lab_net

  watchtower:
    # containrrr/watchtower wurde archiviert und ist mit neueren Docker-Engine-Versionen
    # nicht mehr kompatibel ("client version too old"). Aktiv gepflegter Nachfolge-Fork:
    image: nickfedor/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lab_net

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - lab_net

networks:
  lab_net:
    name: lab_net
    driver: bridge
